---
name: Action Pin Diff
on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pin-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vvoland/gha-pin-diff@v1 # v1
